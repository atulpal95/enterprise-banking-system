spring.application.name=banking-backend

# H2 Test Database
spring.datasource.url=jdbc:h2:mem:banking_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Mail - Test only
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=test@example.com
spring.mail.password=test

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8

# File Storage - Test only
file.upload-dir=target/test-uploads/profiles
file.storage.kyc-dir=target/test-uploads/kyc

# Multipart
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

# Server
server.port=8081

# JWT - Test only
jwt.secret=test-secret-key-for-testing-only-12345678901234567890

app.backend-url=http://localhost:8081
app.frontend-url=http://localhost:5173cls

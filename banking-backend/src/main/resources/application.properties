spring.application.name=banking-backend

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/enterprise_banking_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=INFO


spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.default-encoding=UTF-8

file.upload-dir=${FILE_UPLOAD_DIR:uploads/profiles}
file.storage.kyc-dir=uploads/kyc

# Multipart File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB



# Server
server.port=8081
jwt.secret=${JWT_SECRET}

app.backend-url=${BACKEND_BASE_URL:http://localhost:8081}
app.frontend-url=${FRONTEND_BASE_URL:http://localhost:5173}